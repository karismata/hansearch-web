name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set increasing APK version code
        run: echo "HANSEARCH_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test native back navigation
        run: gradle -p android testDebugUnitTest --no-daemon

      - name: Restore fixed signing identity
        if: github.event_name != 'pull_request'
        env:
          HANSEARCH_SIGNING_BUNDLE: ${{ secrets.HANSEARCH_SIGNING_BUNDLE }}
        run: python3 android/scripts/prepare-signing.py

      - name: Build preview APK
        if: github.event_name == 'pull_request'
        run: gradle -p android assembleDebug --no-daemon

      - name: Build signed APK
        if: github.event_name != 'pull_request'
        run: gradle -p android assembleRelease --no-daemon

      - name: Prepare APK for download
        run: |
          mkdir -p downloads
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk downloads/HanSearch.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk downloads/HanSearch.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose downloads/HanSearch.apk
          fi

      - name: Publish APK to the website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/HanSearch.apk
          if git diff --cached --quiet; then
            echo "The website APK is already up to date."
            exit 0
          fi
          git commit -m "Publish HanSearch Android APK"
          git push origin HEAD:main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanSearch-Android-APK
          path: downloads/HanSearch.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hansearch-signing.p12"
