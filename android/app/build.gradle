plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karismata.hansearch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.karismata.hansearch'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
