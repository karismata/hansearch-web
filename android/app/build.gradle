plugins {
    id 'com.android.application'
}

android {
    namespace 'com.karismata.hansearch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.karismata.hansearch'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('HANSEARCH_VERSION_CODE') ?: '4')
        versionName '1.1.0'
    }

    signingConfigs {
        stableRelease {
            if (System.getenv('HANSEARCH_KEYSTORE_PATH')) {
                storeFile file(System.getenv('HANSEARCH_KEYSTORE_PATH'))
                storeType 'PKCS12'
                storePassword System.getenv('HANSEARCH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HANSEARCH_KEY_ALIAS')
                keyPassword System.getenv('HANSEARCH_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.stableRelease
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}
